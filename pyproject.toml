[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallelwatch"
version = "0.1.0"
description = "Real-time multivariate temporal correlation and anomaly detection engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [
    { name = "Prakul Hiremath" }
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0"
]

keywords = [
    "anomaly-detection",
    "state-space-models",
    "telemetry",
    "timeseries",
    "pytorch",
    "monitoring"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/prakulhiremath/parallelwatch"
Repository = "https://github.com/prakulhiremath/parallelwatch"

[tool.setuptools.packages.find]
include = ["parallelwatch*"]
