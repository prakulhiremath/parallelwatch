[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallelwatch"
version = "0.1.0"
description = "High-performance multivariate temporal correlation engine for anomaly detection"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

authors = [
    { name = "Prakul Hiremath" }
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0"
]

keywords = [
    "anomaly-detection",
    "state-space-models",
    "telemetry",
    "timeseries",
    "pytorch",
    "monitoring",
    "ssm",
    "infrastructure-monitoring"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0"
]

[project.urls]
Homepage = "https://github.com/prakulhiremath/parallelwatch"
Repository = "https://github.com/prakulhiremath/parallelwatch"
Issues = "https://github.com/prakulhiremath/parallelwatch/issues"

[tool.setuptools.packages.find]
include = ["parallelwatch*"]
